<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHACT University</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<script src="/client.js"></script>
<style>
/* University admin portal: same visual system as the professor app (team Figma), its own workspace. */
:root{--bg:#eef1f5;--panel:#fff;--ink:#1b2a3a;--muted:#5f6f80;--line:#dbe2ea;--accent:#2c5f8a;--navy:#15314d;--navy-2:#1f4467;--navy-ink:#c9d6e3;
  --soft:#e4edf5;--ok:#2e8b57;--warn:#d99a1e;--bad:#c8453a}
*{box-sizing:border-box} [hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Source Sans 3",-apple-system,"Segoe UI",sans-serif}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;font-family:inherit;font-weight:600;font-size:14px;line-height:1;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
button.ghost{background:var(--panel);color:var(--accent);border:1px solid var(--line)} button.sm{padding:6px 11px;font-size:13px} button:disabled{opacity:.5;cursor:wait}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
a{color:var(--accent)} .muted{color:var(--muted);font-size:13px}
#shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.rail{background:var(--navy);color:var(--navy-ink);padding:20px 14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;color:#fff;padding:0 6px}
.logo{width:34px;height:34px;border-radius:8px;border:1.5px solid rgba(255,255,255,.55);display:grid;place-items:center;font-size:18px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8ea6bd;padding:10px 8px 0}
nav{display:flex;flex-direction:column;gap:2px} nav a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;color:var(--navy-ink);text-decoration:none;font-weight:600}
nav a:hover{background:rgba(255,255,255,.07);color:#fff} nav a.on{background:var(--navy-2);color:#fff}
.unicard{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:12px;font-size:12.5px}
.unicard b{display:block;color:#fff;font-size:14px}
.foot{margin-top:auto} .me{display:flex;gap:10px;align-items:center;padding:10px 8px;border-top:1px solid rgba(255,255,255,.1)}
.avatar{width:34px;height:34px;border-radius:50%;background:#3d6f99;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.me b{display:block;color:#fff;font-size:13.5px} .me span{font-size:12px;color:#8ea6bd} .me button{margin-left:auto;background:none;color:#8ea6bd;padding:6px}
.top{display:flex;align-items:center;gap:12px;padding:14px 40px;background:var(--panel);border-bottom:1px solid var(--line);font-size:13.5px;color:var(--muted)}
.top .sp{flex:1} .top select{width:auto}
main{padding:28px 40px 60px;max-width:1240px}
h1{font-size:30px;margin:0 0 4px;letter-spacing:-.01em} .head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
.panel h2{font-size:17px;margin:0 0 10px;display:flex;gap:8px;align-items:center} .panel h2 .ti{color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px} .tile b{display:block;font-size:26px} .tile span{font-size:13px;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:14px} th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 8px}
td{padding:12px 8px;border-top:1px solid var(--line);vertical-align:top} tr.click{cursor:pointer} tr.click:hover td{background:#f6f8fb}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:6px;background:var(--soft);color:var(--accent)}
.chip.ok{background:#dff3e8;color:#1d7a52} .chip.warn{background:#fdf0d5;color:#8a5a00} .chip.grey{background:#eef1f5;color:var(--muted)}
.c{display:inline-block;border-radius:6px;padding:2px 8px;color:#fff;font-weight:700;font-size:12px}
.readonly{background:var(--soft);border:1px solid #b9cde0;border-radius:10px;padding:10px 14px;font-size:13.5px;margin-bottom:14px;display:flex;gap:8px}
.rule{display:grid;grid-template-columns:120px 1fr auto;gap:8px;margin-bottom:8px} .seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:8px}
.seg label{text-align:center;padding:11px 6px;font-weight:600;cursor:pointer;border-right:1px solid var(--line);color:var(--muted)} .seg label:last-child{border-right:0}
.seg input{display:none} .seg label:has(input:checked){background:var(--accent);color:#fff}
.code{font:700 18px/1 ui-monospace,Menlo,monospace;letter-spacing:.08em}
.st{font-size:13px;color:var(--muted);min-height:18px;margin-top:8px}
#gate{min-height:100vh;display:grid;place-items:center} #gate .panel{max-width:440px;text-align:center}
@media (max-width:900px){#shell{grid-template-columns:1fr}.rail{position:static;height:auto}.tiles{grid-template-columns:1fr 1fr}main,.top{padding:18px 16px}}
.old{color:var(--bad);font-weight:600}
.cid{display:inline-block;min-width:44px;text-align:center;border-radius:6px;padding:3px 8px;color:#fff;font-weight:700;font-size:12.5px}
.cid.green{background:#2e8b57} .cid.yellow{background:#c98a0b} .cid.red{background:#c8453a}
.qtip{position:relative;display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--soft);color:var(--accent);font-size:12px;font-weight:700;cursor:help;margin-left:6px;vertical-align:middle;text-transform:none;letter-spacing:0}
.qtip .tipbox{display:none;position:absolute;top:24px;left:0;z-index:20;width:270px;background:var(--navy);color:#fff;font-weight:400;font-size:12.5px;line-height:1.5;padding:10px 12px;border-radius:8px;text-align:left}
.qtip:hover .tipbox,.qtip:focus .tipbox{display:block} .tipbox i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
dialog{border:0;border-radius:14px;padding:0;width:min(720px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.25)} dialog::backdrop{background:rgba(21,49,77,.45)}
.dlg{padding:20px 22px;max-height:80vh;overflow:auto} .dlg h2{margin:0 0 12px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.lib{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px} .lib ol{margin:8px 0 0;padding-left:20px;font-size:13.5px}
.lib .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .lib .row b{flex:1}
.x{background:none;color:var(--muted);padding:4px}
</style>
</head>
<body>
<div id="gate" hidden><section class="panel"><h2 style="justify-content:center"><i class="ti ti-lock"></i>University admin sign-in</h2>
  <p class="muted" id="gateMsg"></p><a href="/?as=admin"><button>Go to sign-in</button></a></section></div>

<div id="shell" hidden>
  <aside class="rail">
    <div class="brand"><span class="logo"><i class="ti ti-building"></i></span>PHACT</div>
    <div class="lbl">University admin</div>
    <nav>
      <a href="#/courses" data-v="courses"><i class="ti ti-book"></i>Courses</a>
      <a href="#/competencies" data-v="competencies"><i class="ti ti-target-arrow"></i>Competencies</a>
      <a href="#/professors" data-v="professors"><i class="ti ti-users"></i>Professors</a>
      <a href="#/policy" data-v="policy"><i class="ti ti-shield-check"></i>AI policy</a>
    </nav>
    <div class="unicard"><b id="uniName">…</b><span id="uniPol"></span></div>
    <div class="foot"><div class="me" id="me"></div></div>
  </aside>
  <div>
    <header class="top"><span id="crumb"></span></header>
    <main id="main"></main>
  </div>
</div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const LEVELS = ["none", "assistive", "guided", "integrated"];
const LNAME = {none: "None", assistive: "Assistive", guided: "Guided", integrated: "Integrated"};
const STANCE_LEVEL = {ban: "none", restricted: "guided", open: "integrated"};
const levelOf = p => LEVELS.includes(p?.max_ai_level) ? p.max_ai_level : STANCE_LEVEL[p?.max_ai_stance] || "integrated";
const STATUS = {covered: "var(--ok)", partial: "var(--warn)", missing: "var(--bad)"};
const U = {me: null, uni: null, draft: null};
async function api(method, path, body){
  const r = await fetch(path, {method, headers: body ? {"Content-Type": "application/json"} : {}, body: body ? JSON.stringify(body) : undefined});
  if (r.status === 401) { gate("Your session ended. Please sign in again."); throw new Error("Please sign in."); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || r.statusText);
  return j;
}
function gate(msg){ $("shell").hidden = true; $("gate").hidden = false; $("gateMsg").textContent = msg || ""; }
const DAY = 864e5;
function ago(t){ if (!t) return "—"; const d = (Date.now() - new Date(t).getTime()) / 60000; return d < 60 ? `${Math.max(1, Math.round(d))} min ago` : d < 1440 ? `${Math.round(d / 60)} h ago` : new Date(t).toLocaleDateString(); }
function initials(s){ return String(s || "").replace(/^(dr|prof)\.?\s+/i, "").split(/[\s@.()]+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join(""); }

async function boot(){
  const st = await (await fetch("/api/auth/status")).json().catch(() => ({}));
  PHACT.jobs = !!st.jobs; PHACT.authMode = st.auth_mode || "cookie";
  let me = st.user;
  if (!me && PHACT.hasToken()) { const r = await fetch("/api/me"); if (r.ok) me = await r.json(); }
  if (!me) return gate("Sign in with your university admin account.");
  if (!["school-admin", "aspph-admin", "aspph-staff"].includes(me.role)) return gate("This account isn't a university admin.");
  if (me.role !== "school-admin") { location.href = "/admin"; return; }  // ASPPH staff use the admin console
  U.me = me;
  $("me").innerHTML = `<span class="avatar">${esc(initials(me.name || me.email))}</span><div style="min-width:0"><b>${esc(me.name || me.email)}</b><span>University admin</span></div>
    <button title="Sign out" onclick="signOut()"><i class="ti ti-logout"></i></button>`;
  $("gate").hidden = true; $("shell").hidden = false;
  try { U.uni = await api("GET", "/api/uni"); } catch (e) { return gate(e.message); }
  $("uniName").textContent = U.uni.name; showPol();
  route();
}
const showPol = () => $("uniPol").textContent = `AI up to ${LNAME[levelOf(U.uni.policy)]}`;
window.signOut = async () => { await fetch("/api/auth/logout", {method: "POST"}); PHACT.setToken(null); location.href = "/?as=admin"; };
window.addEventListener("hashchange", route);
function route(){
  const parts = location.hash.slice(1).split("/").filter(Boolean), v = parts[0] || "courses";
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.v === (v === "course" ? "courses" : v)));
  $("crumb").textContent = {professors: "Professors", courses: "Courses", course: "Courses › Course", policy: "AI policy", competencies: "Competencies"}[v] || "Courses";
  ({professors, courses, policy, competencies, course: () => course(decodeURIComponent(parts[1] || ""), decodeURIComponent(parts[2] || ""))}[v] || courses)();
}
const main = html => { $("main").innerHTML = html; window.scrollTo(0, 0); };
const loading = () => main(`<p class="muted">Loading…</p>`);

// ---------- Courses ----------
async function courses(){
  loading();
  const list = await api("GET", "/api/uni/courses");
  main(`<div class="head"><h1>Courses</h1></div><section class="panel">${list.length ? `<table><tr><th>Course</th><th>Professor</th><th>AI level</th><th>Progress</th><th>Competencies</th><th>Updated</th></tr>${list.map(x => {
    const c = x.course || {}, s = x.summary || {}, old = x.updated_at && Date.now() - new Date(x.updated_at) > 365 * DAY;
    const prog = c.exportedAt ? `<span class="chip ok">Exported</span>` : s.changes ? `<span class="chip warn">In review · ${s.accepted || 0}/${s.changes}</span>` : `<span class="chip grey">Setting up</span>`;
    const lv = LNAME[c.ai_level] || LNAME[STANCE_LEVEL[c.ai_stance]] || "—";
    return `<tr class="click" onclick="location.hash='#/course/${encodeURIComponent(x.prof_sub)}/${encodeURIComponent(c.code)}'"><td><b>${esc(c.code)}</b></td>
      <td>${esc(x.professor)}</td><td>${esc(lv)}</td><td>${prog}</td><td>${s.competencies ? `${s.covered || 0}/${s.competencies}` : "—"}</td>
      <td class="${old ? "old" : "muted"}" ${old ? `title="Not updated in over a year"` : ""}>${old ? `<i class="ti ti-alert-circle"></i> ` : ""}${ago(x.updated_at)}</td></tr>`;
  }).join("")}</table>` : `<p class="muted">No courses yet.</p>`}</section>`);
}
async function course(sub, code){
  loading();
  let d; try { d = await api("GET", `/api/uni/courses/${encodeURIComponent(sub)}/${encodeURIComponent(code)}`); }
  catch (e) { return main(`<section class="panel"><b>${esc(e.message)}</b><p><a href="#/courses">Back to courses</a></p></section>`); }
  const row = (await api("GET", "/api/uni/courses")).find(x => x.prof_sub === sub && x.course?.code === code) || {course: {code}};
  main(`<p><a href="#/courses"><i class="ti ti-arrow-left"></i> Courses</a></p>
    <div class="head"><div><h1>${esc(code)}</h1><p class="muted" style="margin:0">${esc([row.course.name, row.professor, row.course.term].filter(Boolean).join(" · "))}</p></div></div>
    <section class="panel"><h2><i class="ti ti-target-arrow"></i>Competencies</h2>
      ${d.competencies.map(c => `<div style="margin:8px 0"><span class="c" style="background:${STATUS[c.status] || "#999"}">#${c.id} ${esc(c.status)}</span> <span class="muted">${esc(c.reason || "")}</span></div>`).join("") || `<p class="muted">Not analyzed yet.</p>`}</section>
    <section class="panel"><h2><i class="ti ti-sparkles"></i>Recommendations</h2>
      <table><tr><th></th><th>Recommendation</th><th>AI level</th><th>Check</th><th>Decision</th></tr>${d.edits.map(e => `<tr><td><b>${esc(e.id)}</b></td><td>${esc(e.proposed)}${e.proposed.length >= 400 ? "…" : ""}</td>
        <td>${e.aias_level ? "AIAS " + e.aias_level : "—"}</td><td><span class="chip ${e.supervisor === "pass" ? "ok" : "warn"}">${e.supervisor === "pass" ? "Verified" : "Flagged"}</span></td>
        <td><span class="chip ${e.decision === "accepted" ? "ok" : e.decision === "rejected" ? "grey" : "warn"}">${esc(e.decision)}</span></td></tr>`).join("") || `<tr><td colspan="5" class="muted">None yet.</td></tr>`}</table></section>
    ${d.assessments.length ? `<section class="panel"><h2><i class="ti ti-files"></i>Assessments</h2>${d.assessments.map(a => `<div>${esc(a.title)} <span class="muted">· ${esc(a.type)} · ${a.accepted}/${a.changes} accepted</span></div>`).join("")}</section>` : ""}
    <section class="panel"><h2><i class="ti ti-file-text"></i>Syllabus AI policy</h2><p style="margin:0">${esc(d.ai_policy || "None")}</p></section>`);
}

// ---------- Competencies (the whole program) ----------
async function competencies(){
  loading();
  const d = await api("GET", "/api/uni/competencies");
  const tip = `<span class="qtip" tabindex="0">?<span class="tipbox">Judged by each course's syllabus, not its assessments.<br><br>
    <i style="background:#2e8b57"></i>1 or more courses fulfill it<br><i style="background:#c98a0b"></i>No course fulfills it, but 2 or more cover it in a limited way<br>
    <i style="background:#c8453a"></i>Otherwise<br><br>${d.analyzed} of ${d.courses} courses analyzed so far.</span></span>`;
  main(`<div class="head"><h1>Competencies</h1></div><section class="panel"><table>
    <tr><th style="width:120px">Competency${tip}</th><th>Summary</th><th style="width:200px">Courses fulfilling it</th></tr>
    ${d.rows.map(r => `<tr><td><span class="cid ${r.color}" title="${r.color === "green" ? "Fulfilled" : r.color === "yellow" ? "Limited" : "Gap"}">#${r.id}</span></td><td>${esc(r.short)}</td>
      <td title="${esc([r.courses.length ? "Fulfilled: " + r.courses.join(", ") : "", r.limited.length ? "Limited: " + r.limited.join(", ") : ""].filter(Boolean).join("\n"))}"><b>${r.fulfilled}</b>${r.limited.length ? ` <span class="muted">· ${r.limited.length} limited</span>` : ""}</td></tr>`).join("")}
  </table></section>`);
}

// ---------- Professors ----------
async function professors(){
  loading();
  const list = await api("GET", "/api/uni/professors");
  main(`<div class="head"><h1>Professors</h1></div><section class="panel"><table><tr><th>Name</th><th>Email</th><th>Role</th><th>Courses</th><th>Joined</th></tr>
    ${list.map(m => `<tr><td><b>${esc(m.name)}</b></td><td>${esc(m.email)}</td><td><span class="chip ${m.role === "school-admin" ? "" : "grey"}">${m.role === "school-admin" ? "University admin" : "Professor"}</span></td>
      <td>${m.courses}</td><td class="muted">${ago(m.joined_at)}</td></tr>`).join("") || `<tr><td colspan="5" class="muted">No professors yet.</td></tr>`}</table></section>`);
}

// ---------- AI policy ----------
function policy(){
  const p = U.draft || U.uni.policy || {}, lv = levelOf(p), dirty = !!U.draft;
  main(`<div class="head"><h1>AI policy</h1>
      <div class="bar" style="margin:0"><button class="ghost" onclick="$('pfile').click()"><i class="ti ti-upload"></i>Upload document</button>
        <input type="file" id="pfile" accept=".pdf,.docx,.txt,.md" hidden onchange="readDoc(this)">
        <button class="ghost" onclick="openLibrary()"><i class="ti ti-books"></i>ASPPH policies</button>
        <button class="ghost" onclick="shareDlg()" ${dirty || !(U.uni.policy?.rules || []).length ? "disabled title='Save a policy with rules first'" : ""}><i class="ti ti-share"></i>Share</button></div></div>
    <div class="st" id="pst" style="margin:-8px 0 12px">${dirty ? `<b style="color:var(--warn)">Not saved yet${U.draftFrom ? ` · ${esc(U.draftFrom)}` : ""}</b>` : p.updated_at ? `Saved ${ago(p.updated_at)}${p.updated_by ? " by " + esc(p.updated_by) : ""}` : ""}</div>
    <section class="panel"><h2>Highest AI level</h2>
      <div class="seg">${LEVELS.map(k => `<label><input type="radio" name="mx" value="${k}" ${lv === k ? "checked" : ""} onchange="draft()">${LNAME[k]}</label>`).join("")}</div></section>
    <section class="panel"><h2>Rules</h2>
      <div id="rules">${(p.rules || []).map(ruleRow).join("")}</div>
      <button class="ghost sm" onclick="$('rules').insertAdjacentHTML('beforeend', ruleRow({})); draft()"><i class="ti ti-plus"></i>Add a rule</button></section>
    <button onclick="savePolicy(this)"><i class="ti ti-device-floppy"></i>Save policy</button>
    ${dirty ? `<button class="ghost" onclick="U.draft=null; U.draftFrom=''; policy()">Discard changes</button>` : ""}
    <div id="shares"></div>`);
  myShares();
}
window.ruleRow = r => `<div class="rule"><input placeholder="ID" value="${esc(r.id || "")}" oninput="draft()"><input placeholder="Rule" value="${esc(r.text || "")}" oninput="draft()"><button class="ghost sm" onclick="this.parentElement.remove(); draft()" title="Remove"><i class="ti ti-x"></i></button></div>`;
const readForm = () => ({max_ai_level: document.querySelector("[name=mx]:checked")?.value || "integrated",
  rules: [...document.querySelectorAll(".rule")].map(d => { const [i, t] = d.querySelectorAll("input"); return {id: i.value.trim(), text: t.value.trim()}; }).filter(r => r.text)});
window.draft = () => { const first = !U.draft; U.draft = {...(U.draft || {}), ...readForm()}; if (first) { const st = $("pst"); st.innerHTML = `<b style="color:var(--warn)">Not saved yet</b>`; } };
function loadDraft(p, from){ U.draft = {max_ai_level: p.max_ai_level, rules: p.rules.map(r => ({...r})), adopted_from: p.id || ""}; U.draftFrom = from; policy(); }
window.savePolicy = async b => {
  b.disabled = true;
  try { U.uni.policy = await api("PUT", "/api/uni/policy", {...readForm(), adopted_from: U.draft?.adopted_from || U.uni.policy?.adopted_from || ""});
        U.draft = null; U.draftFrom = ""; showPol(); policy(); $("pst").textContent = "Saved. Applies to every professor's next analysis."; }
  catch (e) { $("pst").textContent = "Error: " + e.message; b.disabled = false; }
};
window.readDoc = async inp => {
  const f = inp.files[0]; if (!f) return; inp.value = "";
  $("pst").innerHTML = `<span class="muted"><i class="ti ti-loader-2"></i> Reading ${esc(f.name)}…</span>`;
  try {
    let out;
    if (PHACT.jobs) out = await PHACT.runJob("/api/uni/policy/extract", null, {name: f.name, b64: await PHACT.fileToB64(f)});
    else { const fd = new FormData(); fd.append("file", f); const r = await fetch("/api/uni/policy/extract", {method: "POST", body: fd}); out = await r.json(); if (!r.ok) throw new Error(out.detail || r.statusText); }
    if (!out.rules?.length) { $("pst").textContent = `No AI rules found in ${f.name}.`; return; }
    loadDraft({max_ai_level: out.max_ai_level, rules: out.rules}, `${out.rules.length} rules read from ${f.name}`);
  } catch (e) { $("pst").textContent = "Error: " + e.message; }
};
window.openLibrary = async () => {
  $("dlgBody").innerHTML = `<p class="muted">Loading…</p>`; $("dlg").showModal();
  const d = await api("GET", "/api/uni/policy/library"); U.lib = d.library;
  $("dlgBody").innerHTML = `<h2>Policies<button class="x" onclick="$('dlg').close()"><i class="ti ti-x"></i></button></h2>
    ${d.library.map((p, i) => `<div class="lib"><div class="row"><b>${esc(p.name)}</b><span class="chip">${LNAME[p.max_ai_level] || ""}</span>
      <span class="chip grey">${esc(p.publisher)}</span><button class="sm" onclick="adopt(${i})">Use</button></div>
      <ol>${p.rules.map(r => `<li>${esc(r.text)}</li>`).join("")}</ol></div>`).join("")}`;
};
window.adopt = i => { const p = U.lib[i]; $("dlg").close(); loadDraft(p, `from “${p.name}”`); };
window.shareDlg = () => {
  const p = U.uni.policy;
  $("dlgBody").innerHTML = `<h2>Share with ASPPH<button class="x" onclick="$('dlg').close()"><i class="ti ti-x"></i></button></h2>
    <label class="muted">Name<input id="sname" value="${esc(U.uni.name)} AI policy"></label>
    <div class="lib" style="margin-top:12px"><div class="row"><b>${(p.rules || []).length} rules</b><span class="chip">${LNAME[levelOf(p)]}</span></div>
      <ol>${(p.rules || []).map(r => `<li>${esc(r.text)}</li>`).join("")}</ol></div>
    <p class="muted">ASPPH reviews it before other universities can use it.</p>
    <button onclick="doShare(this)"><i class="ti ti-send"></i>Send for review</button>`;
  $("dlg").showModal();
};
window.doShare = async b => {
  b.disabled = true;
  try { await api("POST", "/api/uni/policy/share", {...U.uni.policy, max_ai_level: levelOf(U.uni.policy), name: $("sname").value}); $("dlg").close(); myShares(); }
  catch (e) { b.disabled = false; alert(e.message); }
};
async function myShares(){
  const d = await api("GET", "/api/uni/policy/library").catch(() => null);
  if (!d?.my_shares?.length || !$("shares")) return;
  const CH = {pending: ["warn", "In review"], approved: ["ok", "In the ASPPH library"], returned: ["grey", "Returned"]};
  $("shares").innerHTML = `<section class="panel" style="margin-top:20px"><h2><i class="ti ti-share"></i>Shared</h2><table>${d.my_shares.map(s => `<tr><td><b>${esc(s.name)}</b></td>
    <td><span class="chip ${CH[s.status]?.[0] || "grey"}">${CH[s.status]?.[1] || esc(s.status)}</span>${s.review_note ? `<div class="muted">${esc(s.review_note)}</div>` : ""}</td><td class="muted">${ago(s.submitted_at)}</td></tr>`).join("")}</table></section>`;
}
boot();
</script>
</body>
