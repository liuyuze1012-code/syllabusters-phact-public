# Installable package so backend/ and agent/ share one copy of the contract:
#   pip install -e ../shared
[project]
name = "phact-contracts"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["phact_contracts"]
